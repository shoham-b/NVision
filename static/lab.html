<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NVision lab study</title>
    <link rel="stylesheet" href="styles.css">
    <script src="plotly-utils.js"></script>
    <style>
        /* Token values copied from docs/design_system/tokens.css (styles.css carries none). */
        :root {
            --series-1: #1e90ff; --series-2: #e05c00; --series-3: #00a878;
            --trace-mode: #d62728; --chart-grid: #eeeeee;
            --slate-50: #f8fafc; --slate-200: #e2e8f0; --slate-500: #64748b; --slate-600: #475569; --slate-800: #1e293b;
            --font-mono: ui-monospace, SFMono-Regular, "Cascadia Code", monospace;
        }
        .chart-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1em; }
        .chart-card { background: #fff; border: 1px solid var(--slate-200); border-radius: 8px; padding: 0.6em 0.8em; }
        .chart-card h3 { margin: 0 0 0.3em; font-size: 1em; color: var(--slate-800); }
        .lab-table { border-collapse: collapse; width: 100%; font-size: 0.9em; background: #fff; }
        .lab-table th, .lab-table td { border: 1px solid var(--slate-200); padding: 0.35em 0.6em; text-align: right; }
        .lab-table th { background: var(--slate-50); color: var(--slate-600); font-weight: 600; }
        .lab-table td { font-family: var(--font-mono); color: var(--slate-800); }
        .lab-table td:first-child, .lab-table th:first-child { text-align: left; }
        .lab-note { color: var(--slate-600); font-size: 0.85em; margin: 0.6em 0; }
        .empty-state { color: var(--slate-500); padding: 2em; text-align: center; }
    </style>
</head>
<body>
<h1>NVision lab study <span id="lab-title" style="font-size:0.6em; font-weight:400;"></span></h1>
<div class="section tab-panel" id="lab-section">
    <h2>Calibration — does the claimed σ match the error? <span tabindex="0" class="help-icon-visible" title="The lab's own Bayesian ESR runs (MATLAB), repeated 100 times per drive_freq window. Each run reports a posterior σ for the resonance; the runs' final estimates scatter by the across-run std. If the claimed σ is the truth, the two agree.">?</span></h2>
    <div id="lab-body"><p class="empty-state">Loading…</p></div>
</div>
<script>
(async function () {
    const body = document.getElementById('lab-body');
    const fmt = (x, d = 2) => (x == null || Number.isNaN(x) ? '–' : Number(x).toFixed(d));
    let data;
    try {
        const resp = await fetch('/api/lab-study', { cache: 'no-store' });
        if (!resp.ok) throw new Error((await resp.json()).detail || `HTTP ${resp.status}`);
        data = await resp.json();
    } catch (err) {
        body.innerHTML = `<p class="empty-state">No lab study: ${err.message}. Start the server with <code>nv serve --lab-dir &lt;convergence_statistics&gt;</code>.</p>`;
        return;
    }
    document.getElementById('lab-title').textContent = `reference ${fmt(data.reference_mhz, 2)} MHz (median of final means)`;
    const colors = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)'];
    const resolved = colors.map(c => getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim());
    const cols = [
        ['Window (MHz)', r => r.window_mhz],
        ['Converged', r => `${r.n_converged}/${r.n_runs}`],
        ['Steps, median (IQR)', r => `${fmt(r.steps_median, 0)} (${fmt(r.steps_q25, 0)}–${fmt(r.steps_q75, 0)})`],
        ['Claimed σ (MHz)', r => fmt(r.claimed_sigma_mhz)],
        ['Across-run std (MHz)', r => fmt(r.across_run_std_mhz)],
        ['Actual ÷ claimed', r => fmt(r.overconfidence)],
        ['Within 1σ (nominal 0.68)', r => fmt(r.within_1sigma)],
        ['Within 2σ (nominal 0.95)', r => fmt(r.within_2sigma)],
        ['95% interval hit', r => fmt(r.ci95_hit)],
    ];
    body.innerHTML = `
        <table class="lab-table"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead>
        <tbody>${data.windows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="lab-note">No ground truth exists for real data: error is measured against the reference above, so the across-run std also contains any real drift of the resonance between runs. Read "Actual ÷ claimed" as an upper bound on miscalibration.</p>
        <div class="chart-pair">
            <div class="chart-card"><h3>Claimed σ vs actual spread <span tabindex="0" class="help-icon-visible" title="Solid: median self-reported posterior std (band: quartiles). Dashed: std across runs of the posterior mean at that step. Dashed above solid means the runs are overconfident. Both include only runs still measuring at that step.">?</span></h3><div id="lab-sigma" style="height:420px"></div></div>
            <div class="chart-card"><h3>Steps to convergence <span tabindex="0" class="help-icon-visible" title="Median number of measurements until the run's own stop rule fired, with the interquartile range, per drive_freq window.">?</span></h3><div id="lab-steps" style="height:420px"></div></div>
        </div>`;
    await ensurePlotly();
    const traces = [];
    data.windows.forEach((r, i) => {
        const c = data.curves[String(r.window_mhz)];
        const color = resolved[i % resolved.length];
        const name = `${r.window_mhz} MHz`;
        traces.push({ x: c.step, y: c.claimed_q75, mode: 'lines', line: { width: 0 }, hoverinfo: 'skip', showlegend: false, legendgroup: name });
        traces.push({ x: c.step, y: c.claimed_q25, mode: 'lines', line: { width: 0 }, fill: 'tonexty', fillcolor: color + '22', hoverinfo: 'skip', showlegend: false, legendgroup: name });
        traces.push({ x: c.step, y: c.claimed_median, mode: 'lines', line: { color, width: 2 }, name: `${name} claimed`, legendgroup: name });
        traces.push({ x: c.actual_step, y: c.across_run_std, mode: 'lines', line: { color, width: 2, dash: 'dash' }, name: `${name} actual`, legendgroup: name });
    });
    Plotly.newPlot('lab-sigma', traces, {
        margin: { t: 10, r: 10, b: 50, l: 60 }, hovermode: 'x unified',
        xaxis: { title: 'measurement step', type: 'log', gridcolor: '#eeeeee' },
        yaxis: { title: 'σ (MHz)', type: 'log', gridcolor: '#eeeeee' },
        legend: { orientation: 'h', y: -0.25 },
    }, { responsive: true });
    const w = data.windows;
    Plotly.newPlot('lab-steps', [{
        x: w.map(r => `${r.window_mhz} MHz`), y: w.map(r => r.steps_median), type: 'bar',
        marker: { color: resolved[0] },
        error_y: { type: 'data', symmetric: false, array: w.map(r => r.steps_q75 - r.steps_median), arrayminus: w.map(r => r.steps_median - r.steps_q25) },
    }], {
        margin: { t: 10, r: 10, b: 50, l: 60 },
        xaxis: { title: 'drive_freq window' }, yaxis: { title: 'measurements to converge', gridcolor: '#eeeeee' },
    }, { responsive: true });
})();
</script>
</body>
</html>
