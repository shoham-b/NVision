<!-- @dsCard group="Feedback" height=340 subtitle="Run state above the results: scheduled, running, partial, error, complete" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>RunStatusBanner</title><style>body{margin:16px}</style></head>
<body>
<div class="run-status-banner run-status-scheduled" role="status">Scheduled — 3 combos queued</div>
<div class="run-status-banner run-status-running" role="status"><span class="run-status-spinner" aria-hidden="true"></span>Running — 41 / 120 repeats done<button type="button" class="run-status-refresh-btn">Refresh</button></div>
<div class="run-status-banner run-status-partial" role="status">Partial results — 2 combos still running</div>
<div class="run-status-banner run-status-error" role="alert">Run failed — see server log</div>
<div class="run-status-banner run-status-complete" role="status" style="margin-bottom:0">Complete — 120 repeats</div>
</body></html>
