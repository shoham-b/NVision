<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SliderWithArrows</title><style>body{margin:16px;background:var(--surface);display:flex}</style></head>
<body>
<div class="slider-with-arrows">
  <button type="button" class="control-button arrow-btn" aria-label="Previous step">◀</button>
  <input type="range" min="0" max="120" value="61" aria-label="Step">
  <button type="button" class="control-button arrow-btn" aria-label="Next step">▶</button>
  <span class="slider-value-display">61</span>
</div>
</body></html>
