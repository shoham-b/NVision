<!-- @dsCard group="Layout" height=360 subtitle="Plot container and the chart colour slots (static rendition, no Plotly)" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>PlotFrame</title>
<style>
body{margin:16px;background:var(--surface)}
.pf{min-height:0;height:250px;margin-top:0;overflow:hidden}
.pf svg{display:block;width:100%;height:100%}
.grid{stroke:var(--chart-grid)}
.truth{stroke:var(--trace-true-signal);stroke-width:2;fill:none}
.noisy{stroke:var(--trace-noisy);stroke-dasharray:2 3;fill:none}
.band{fill:var(--trace-noisy-band-1)}
.mode{stroke:var(--trace-mode);stroke-width:2;stroke-dasharray:7 5;fill:none}
.coarse{fill:var(--trace-coarse);stroke:var(--trace-coarse-edge);stroke-width:.6}
.sec{fill:var(--trace-secondary);stroke:var(--trace-secondary-edge);stroke-width:.6}
.ter{fill:var(--trace-tertiary);stroke:var(--trace-tertiary-edge);stroke-width:.6}
.tick{stroke:var(--orange-500);stroke-dasharray:2 2}
.lbl{font:11px var(--font-sans);fill:var(--ink-muted)}
.sw{display:flex;gap:4px;margin-top:10px;align-items:center;font:12px var(--font-mono);color:var(--slate-600)}
.sw span{width:72px}
.sw i{display:inline-block;width:22px;height:12px;border-radius:2px}
</style></head>
<body>
<div class="plotly-json-plot pf">
<svg viewBox="0 0 600 250" preserveAspectRatio="none" aria-label="Static rendition of a scan plot">
  <g class="grid"><line x1="40" y1="40" x2="590" y2="40"/><line x1="40" y1="100" x2="590" y2="100"/><line x1="40" y1="160" x2="590" y2="160"/><line x1="40" y1="220" x2="590" y2="220"/></g>
  <line class="tick" x1="380" y1="20" x2="380" y2="225"/>
  <path class="band" d="M40 52 L250 54 Q300 190 350 54 L590 52 L590 72 L350 74 Q300 214 250 74 L40 72Z"/>
  <path class="noisy" d="M40 62 L120 60 L200 64 L250 63 Q300 205 350 63 L430 61 L510 64 L590 62"/>
  <path class="truth" d="M40 62 L250 64 Q300 200 350 64 L590 62"/>
  <path class="mode" d="M40 63 L252 65 Q302 196 352 65 L590 63"/>
  <circle class="coarse" cx="70" cy="60" r="3.5"/><circle class="coarse" cx="150" cy="66" r="3.5"/><circle class="coarse" cx="230" cy="62" r="3.5"/><circle class="coarse" cx="410" cy="61" r="3.5"/><circle class="coarse" cx="520" cy="64" r="3.5"/>
  <circle class="sec" cx="270" cy="100" r="3.5"/><circle class="sec" cx="330" cy="104" r="3.5"/><circle class="sec" cx="285" cy="128" r="3.5"/>
  <circle class="ter" cx="298" cy="138" r="3.5"/><circle class="ter" cx="303" cy="134" r="3.5"/><circle class="ter" cx="307" cy="140" r="3.5"/>
  <text class="lbl" x="300" y="244" text-anchor="middle">drive_freq (Hz)</text>
</svg>
</div>
<div class="sw"><span>series</span><i style="background:var(--series-1)"></i><i style="background:var(--series-2)"></i><i style="background:var(--series-3)"></i><i style="background:var(--series-4)"></i><i style="background:var(--series-5)"></i><i style="background:var(--series-6)"></i><i style="background:var(--series-7)"></i></div>
<div class="sw"><span>highlight</span><i style="background:var(--highlight-1)"></i><i style="background:var(--highlight-2)"></i><i style="background:var(--highlight-3)"></i><i style="background:var(--highlight-4)"></i><i style="background:var(--highlight-5)"></i><i style="background:var(--highlight-6)"></i><i style="background:var(--highlight-7)"></i><i style="background:var(--highlight-8)"></i></div>
</body></html>
