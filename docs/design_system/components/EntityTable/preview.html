<!-- @dsCard group="Data" height=290 subtitle="Repeats summary: one card per strategy, metrics × statistics grid" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>EntityTable</title><style>body{margin:16px;background:var(--surface)}</style></head>
<body>
<div class="entity-group">
  <div class="entity-group-header">Bayesian-SBED · Gauss(0.01)</div>
  <div class="entity-table" style="grid-template-columns:160px repeat(3,1fr)">
    <div class="entity-table-blank"></div>
    <div class="entity-table-col-header">Median</div>
    <div class="entity-table-col-header">IQR</div>
    <div class="entity-table-col-header">Max</div>
    <div class="entity-table-row-label">steps to converge</div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">61</span></div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">18</span></div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">112</span></div>
    <div class="entity-table-row-label">abs_err_x (kHz)</div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">1.2</span></div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">0.8</span></div>
    <div class="entity-table-cell"><span class="entity-metric-na">—</span></div>
  </div>
</div>
<div class="entity-group entity-group-delta" style="margin-bottom:0">
  <div class="entity-group-header">Δ Bayesian-SBED − SimpleSweep</div>
  <div class="entity-table" style="grid-template-columns:160px repeat(3,1fr)">
    <div class="entity-table-row-label">steps to converge</div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">−179</span></div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">−40</span></div>
    <div class="entity-table-cell"><span class="entity-metric-scalar">−128</span></div>
  </div>
</div>
</body></html>
