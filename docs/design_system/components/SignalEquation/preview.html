<!-- @dsCard group="Data" height=220 subtitle="The generator's signal model, typeset in HTML" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SignalEquation</title><style>body{margin:16px;background:var(--surface)}</style></head>
<body>
<div class="signal-equation-panel" style="margin:0">
  <div class="signal-equation-title">Signal model — Lorentzian</div>
  <div class="signal-equation-formula">
    PL(f) = 1 − <b>C</b> <span class="eq-brackets">
      <span class="eq-frac"><span class="eq-num">Γ²</span><span class="eq-den">(f − D + <b>Δ</b>)² + Γ²</span></span>
      +
      <span class="eq-frac"><span class="eq-num">Γ²</span><span class="eq-den">(f − D − <b>Δ</b>)² + Γ²</span></span>
    </span>
  </div>
  <div class="signal-equation-note">
    <div class="signal-eq-note-block"><span class="signal-eq-note-label">where</span>
      <ul class="signal-eq-note-list"><li><b>Δ</b> = zeeman_split / 2</li><li><b>C</b> = c_total contrast</li></ul>
    </div>
  </div>
  <div class="signal-equation-params"><span class="signal-eq-param"><b>D</b> = 2.870 GHz</span><span class="signal-eq-param"><b>Γ</b> = 0.7 MHz</span></div>
</div>
</body></html>
