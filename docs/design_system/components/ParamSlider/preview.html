<!-- @dsCard group="Data" height=200 subtitle="Sweep-narrowed prior cards and the true-value range marker" -->
<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ParamSlider</title><style>body{margin:16px;background:var(--surface)}</style></head>
<body>
<div class="param-bounds-header">Sweep-narrowed priors</div>
<div class="param-bounds-grid">
  <div class="param-slider-card">
    <span class="param-slider-label">zeeman split</span>
    <div class="param-slider-wrapper">
      <div class="param-slider-track-bg"></div>
      <div class="param-slider-track-fill" style="left:22%;width:34%"></div>
      <div class="param-slider-handle" style="left:39%"></div>
      <span class="param-slider-value" style="left:39%">3.9 MHz</span>
    </div>
    <div class="param-slider-bounds"><span>1.0</span><span>10.0</span></div>
  </div>
  <div class="param-slider-card">
    <span class="param-slider-label">linewidth</span>
    <div class="param-slider-wrapper">
      <div class="param-slider-track-bg"></div>
      <div class="param-slider-track-fill" style="left:10%;width:28%"></div>
      <div class="param-slider-handle" style="left:24%"></div>
      <span class="param-slider-value" style="left:24%">0.7 MHz</span>
    </div>
    <div class="param-slider-bounds"><span>0.1</span><span>3.0</span></div>
  </div>
</div>
<div class="param-range-container" style="max-width:240px;margin-top:14px">
  <div class="param-range-track"><span class="param-range-marker" style="left:62%"></span></div>
  <div class="param-range-bounds"><span>2.85 GHz</span><span>2.89 GHz</span></div>
</div>
</body></html>
