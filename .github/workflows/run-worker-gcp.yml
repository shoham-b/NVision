name: Run Worker on GCP

on:
  workflow_dispatch:
    inputs:
      run_group:
        description: "Run group"
        required: true
        default: "both-sbed-only"
        type: choice
        options:
          - lorentzian-sbed
          - lorentzian-sbed-only
          - lorentzian-sweep-only
          - voigt-sbed
          - voigt-sbed-only
          - voigt-sweep-only
          - voigt-inhom-sbed
          - voigt-inhom-sbed-only
          - voigt-inhom-sweep-only
          - lorentzian-plain-sbed
          - lorentzian-plain-sbed-only
          - lorentzian-plain-sweep-only
          - both-sbed
          - both-sbed-only
          - both-sweep-only
      repeats:
        description: "Repeats per scenario"
        required: true
        default: "5"
        type: string
      max_shards:
        description: "Cap on the number of parallel Cloud Run Job tasks (shards)"
        required: true
        default: "20"
        type: string
      gcp_bucket:
        description: "GCP bucket"
        required: true
        default: "nvision-artifacts-shoha"
        type: string

env:
  PROJECT_ID: nvision-lab
  REGION: us-central1
  MYSQL_INSTANCE: nvision-mysql
  MYSQL_DB: nvision
  MYSQL_USER: nvision
  MYSQL_PORT: "3306"

jobs:
  run-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/worker/Dockerfile
          target: runtime
          push: true
          tags: us-docker.pkg.dev/${{ env.PROJECT_ID }}/nvision/worker:${{ github.sha }}

      # No manual GCP config needed: the DB host is looked up dynamically (it's
      # not a secret -- Cloud SQL public IPs aren't sensitive on their own) and
      # the only credential involved is the single MYSQL_PASSWORD secret.
      - name: Resolve Cloud SQL host
        id: mysql_host
        run: |
          HOST=$(gcloud sql instances describe "$MYSQL_INSTANCE" --format="value(ipAddresses[0].ipAddress)")
          if [ -z "$HOST" ]; then
            echo "::error::Could not resolve Cloud SQL instance '$MYSQL_INSTANCE' -- has provision-gcp.yml been run yet?"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      # Shard count is computed from the actual workload, not hardcoded --
      # mirrors the local `nv run` philosophy of never spawning more workers
      # than there are tasks. Runs against the image just pushed, so the count
      # always matches exactly the code being deployed.
      - name: Compute shard count
        id: shard_count
        run: |
          IMAGE="us-docker.pkg.dev/${{ env.PROJECT_ID }}/nvision/worker:${{ github.sha }}"
          COUNT=$(docker run --rm --entrypoint nv "$IMAGE" groups count "${{ github.event.inputs.run_group }}" --max-shards "${{ github.event.inputs.max_shards }}")
          echo "Resolved shard count: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run job
        run: |
          IMAGE="us-docker.pkg.dev/${{ env.PROJECT_ID }}/nvision/worker:${{ github.sha }}"
          JOB_NAME=nvision-worker
          REGION=${{ env.REGION }}
          TASKS="${{ steps.shard_count.outputs.count }}"

          ENV_VARS="RUN_GROUP=${{ github.event.inputs.run_group }}"
          ENV_VARS="$ENV_VARS,NVISION_GCP=False" # per-shard upload would race on the shared manifest; a single aggregation step uploads once at the end
          ENV_VARS="$ENV_VARS,NVISION_GCP_BUCKET=${{ github.event.inputs.gcp_bucket }}"
          ENV_VARS="$ENV_VARS,NVISION_CACHE_BACKEND=mysql"
          ENV_VARS="$ENV_VARS,NVISION_MYSQL_HOST=${{ steps.mysql_host.outputs.host }}"
          ENV_VARS="$ENV_VARS,NVISION_MYSQL_PORT=$MYSQL_PORT"
          ENV_VARS="$ENV_VARS,NVISION_MYSQL_USER=$MYSQL_USER"
          ENV_VARS="$ENV_VARS,NVISION_MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}"
          ENV_VARS="$ENV_VARS,NVISION_MYSQL_DATABASE=$MYSQL_DB"

          # --shard-index is deliberately NOT passed via --args (a single arg string
          # can't vary per task) -- it resolves from the CLOUD_RUN_TASK_INDEX env var
          # Cloud Run Jobs injects into each task automatically.
          # --parallelism belongs here (create/update), not on `execute` -- it's a
          # job-spec property, not a per-execution override. `execute` only accepts
          # --tasks (which can override the task count for a single run).
          if gcloud run jobs describe $JOB_NAME --region $REGION >/dev/null 2>&1; then
            gcloud run jobs update $JOB_NAME \
              --image $IMAGE \
              --region $REGION \
              --tasks $TASKS \
              --parallelism $TASKS \
              --set-env-vars "$ENV_VARS" \
              --max-retries=1
          else
            gcloud run jobs create $JOB_NAME \
              --image $IMAGE \
              --region $REGION \
              --tasks $TASKS \
              --parallelism $TASKS \
              --set-env-vars "$ENV_VARS" \
              --max-retries=1
          fi

      - name: Execute Cloud Run job
        run: |
          TASKS="${{ steps.shard_count.outputs.count }}"
          gcloud run jobs execute nvision-worker \
            --region ${{ env.REGION }} \
            --wait \
            --tasks "$TASKS" \
            --args="--repeats=${{ github.event.inputs.repeats }},--shard-count=$TASKS"

      # Aggregation: with sharded workers, each pod owns its own MySQL table
      # (see nvision/cache/mysql.py) and never uploads to GCS itself. This single
      # step reads the shared cache in its default read-aggregate mode (fans out
      # across every shard's table) and does the one, race-free upload.
      - name: Aggregate results and upload to GCS
        run: |
          IMAGE="us-docker.pkg.dev/${{ env.PROJECT_ID }}/nvision/worker:${{ github.sha }}"
          # `nv render` (no filters) picks up everything currently in the cache --
          # in aggregate read mode (no shard_suffix) that's the union of every
          # shard's table, so this one call covers the whole sharded run.
          docker run --rm --entrypoint nv \
            -e NVISION_CACHE_BACKEND=mysql \
            -e NVISION_MYSQL_HOST="${{ steps.mysql_host.outputs.host }}" \
            -e NVISION_MYSQL_PORT="$MYSQL_PORT" \
            -e NVISION_MYSQL_USER="$MYSQL_USER" \
            -e NVISION_MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -e NVISION_MYSQL_DATABASE="$MYSQL_DB" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json \
            -v "${{ steps.auth.outputs.credentials_file_path }}:/tmp/gcp-key.json:ro" \
            "$IMAGE" render --gcp --gcp-bucket "${{ github.event.inputs.gcp_bucket }}"
