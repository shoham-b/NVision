name: Deploy Railway (serve)

# Deploys the results UI (docker/serve/Dockerfile, see railway.json for the
# build config) to Railway on every push to main -- separate from docker.yml,
# which only builds/pushes the GHCR images and doesn't deploy anywhere.
#
# One-time manual setup (Railway has no equivalent to provision-gcp.yml, this
# can't be scripted since it needs your Railway account):
#   1. Create a Railway project, with a service named "serve" in it, and
#      connect nothing to GitHub -- this workflow pushes builds itself via
#      the CLI, no Railway git integration needed.
#   2. Dashboard -> Project Settings -> Tokens -> create a Project Token
#      (scoped to this project + environment, e.g. "production").
#   3. Add it as the RAILWAY_TOKEN secret in this repo's GitHub settings.
#   4. Cache backend defaults to local SQLite (empty until you point it at a
#      shared cache) -- set NVISION_CACHE_BACKEND=mysql plus the
#      NVISION_MYSQL_* variables (see .env.example) as Railway service
#      variables if/when the deployed UI should show real run data.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy serve service to Railway
        run: railway up --service serve --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
